name: Release APK

# Publishes the optimized build as a GitHub Release with the APK attached.
# Run it from the Actions tab and give it a tag, e.g. v1.0.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: v1.0.0
      title:
        description: Release title
        required: false
        default: Mihon Dev — Instant translation
  # Pushing a tag is the simplest way to publish: the workflow file only has to
  # exist in the tagged commit, unlike a manual run which needs it on main first.
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A runner starts without a debug keystore, and the one AGP then generates is a new key on every
      # run, so each build refused to install over the last one. Use the committed dev key instead.
      - name: Use the repository's debug signing key
        run: |-
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      # The optimized build type is a minified, non-debuggable build signed with the debug key and
      # carrying the debug identity, so it upgrades an installed debug build in place while letting
      # ART precompile it from the bundled baseline profile.
      - name: Build optimized APK
        id: build
        run: |-
          set -o pipefail
          ./gradlew assembleOptimized -Pdist=local --stacktrace 2>&1 | tee build.log

      - name: Annotate build errors
        if: failure()
        run: |-
          python3 - <<'PY'
          import re

          try:
              lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              lines = []

          pat = re.compile(r"^(e: |error:|FAILURE:|Caused by:|\* What went wrong)")
          picked = [l for l in lines if pat.match(l.strip())][:20] or lines[-20:]
          for line in picked:
              msg = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{msg[:900]}")
          PY

      - name: Collect APKs
        run: |-
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a; do
            src="app/build/outputs/apk/optimized/app-${abi}-optimized.apk"
            [ -f "$src" ] && cp "$src" "release-apks/app-${abi}.apk"
          done
          [ -f app/build/outputs/apk/optimized/app-universal-optimized.apk ] && \
            cp app/build/outputs/apk/optimized/app-universal-optimized.apk release-apks/app-universal.apk
          ls -lh release-apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |-
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          TITLE="${INPUT_TITLE:-Mihon Dev ${TAG}}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apks/*.apk --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --latest
          else
            gh release create "$TAG" release-apks/*.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              --latest
          fi

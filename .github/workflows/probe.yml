name: Probe
on:
  push:
    branches: [arena/3178ed81-mihon]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./gradlew spotlessCheck --console=plain > /tmp/f.log 2>&1
          echo "format_exit=$?" > /tmp/out.md
          ./gradlew :app:compileDebugKotlin --console=plain > /tmp/c.log 2>&1
          echo "compile_exit=$?" >> /tmp/out.md
          ./gradlew :domain:test --console=plain > /tmp/t.log 2>&1
          echo "test_exit=$?" >> /tmp/out.md
          {
            echo '```'
            echo "=== FORMAT"; tail -30 /tmp/f.log
            echo "=== COMPILE"; tail -40 /tmp/c.log
            echo "=== TEST"; tail -25 /tmp/t.log
            echo '```'
          } >> /tmp/out.md
          gh pr comment 15 --body-file /tmp/out.md

name: Probe
on:
  push:
    branches: [arena/3178ed81-mihon]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Format
        run: |
          ./gradlew spotlessCheck --console=plain > /tmp/f.log 2>&1; echo "exit=$?"
          sed -n '/had format violations/,/Run .\/gradlew spotlessApply/p' /tmp/f.log | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Compile
        run: |
          ./gradlew :app:compileDebugKotlin --console=plain > /tmp/c.log 2>&1; echo "exit=$?"
          grep -E "^e: |error:" /tmp/c.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Tests
        run: |
          ./gradlew :domain:test --console=plain > /tmp/t.log 2>&1; echo "exit=$?"
          grep -E "^e: |FAILED|error:" /tmp/t.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true

name: Probe
on:
  push:
    branches: [arena/3178ed81-mihon]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew spotlessCheck --console=plain > /tmp/f.log 2>&1; echo "format_exit=$?" > /tmp/out.md
          ./gradlew :app:compileDebugKotlin :domain:test --console=plain > /tmp/c.log 2>&1; echo "build_exit=$?" >> /tmp/out.md
          {
            echo '```'
            grep -E "^e: |error:|FAILED|Violations|>> |was wrong" /tmp/f.log /tmp/c.log | head -60 | sed 's/`/'"'"'/g'
            echo '```'
          } >> /tmp/out.md
          gh pr comment 15 --body-file /tmp/out.md

name: Test probe

on:
  push:
    branches: [arena/2dc0be8e-mihon]

concurrency:
  group: test-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile output
        run: |
          set +e
          ./gradlew :domain:compileDebugUnitTestKotlin --console=plain > /tmp/t.log 2>&1
          echo "exit=$?"
          sed -n '/^e: /p' /tmp/t.log | head -40 > /tmp/short.log
          cat /tmp/short.log
          while IFS= read -r line; do echo "::error::$line"; done < /tmp/short.log
          exit 0

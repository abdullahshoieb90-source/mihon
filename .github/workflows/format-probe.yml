name: Format probe

on:
  push:
    branches: [arena/2dc0be8e-mihon]

concurrency:
  group: format-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless output
        run: |
          set +e
          ./gradlew spotlessCheck --console=plain > /tmp/spotless.log 2>&1
          echo "exit=$?"
          # The block after the file name holds the offending lines, with a caret under the exact column.
          sed -n '/had format violations/,/Run .\/gradlew spotlessApply/p' /tmp/spotless.log | head -40 > /tmp/short.log
          cat /tmp/short.log
          while IFS= read -r line; do echo "::error::$line"; done < /tmp/short.log
          exit 0
